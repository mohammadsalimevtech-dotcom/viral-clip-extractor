<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Viral Clip Extractor</title>
<style>
  :root{
    --bg:#0b0d12; --card:#151822; --border:#242838; --text:#f4f5f7;
    --muted:#9aa1b2; --accent:#7c5cff; --accent2:#ff5c8a; --ok:#3ddc97; --err:#ff5c5c;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:-apple-system,Segoe UI,Roboto,Inter,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%, #1c1f2e, var(--bg));
    color:var(--text); min-height:100vh; padding:40px 16px;
    padding-top:calc(40px + env(safe-area-inset-top,0px));
  }
  .wrap{max-width:720px;margin:0 auto}
  h1{
    font-size:2.1rem; text-align:center; margin-bottom:6px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  p.sub{text-align:center;color:var(--muted);margin-top:0;margin-bottom:32px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  input[type=text]{
    flex:1; min-width:220px; background:#0f1117;border:1px solid var(--border);
    color:var(--text);padding:14px 16px;border-radius:10px;font-size:1rem;outline:none;
  }
  input[type=text]:focus{border-color:var(--accent)}
  button{
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    border:none;color:#fff;padding:14px 22px;border-radius:10px;font-size:1rem;
    font-weight:600;cursor:pointer;
  }
  button:disabled{opacity:.5;cursor:not-allowed}
  .status{margin-top:18px;color:var(--muted);font-size:.95rem}
  .status.err{color:var(--err)}
  .clips{margin-top:28px;display:grid;gap:16px}
  .clip{background:#0f1117;border:1px solid var(--border);border-radius:14px;padding:16px}
  .clip h3{margin:0 0 6px 0;font-size:1.05rem}
  .clip .meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:.85rem;margin-bottom:10px}
  .score{color:var(--ok);font-weight:700}
  video{width:100%;border-radius:10px;display:block}
  a.dl{color:var(--accent);text-decoration:none;font-weight:600;display:inline-block;margin-top:8px}
  label{display:flex;align-items:center;gap:8px;margin-top:14px;color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>Viral Clip Extractor</h1>
  <p class="sub">YouTube link daalo, AI usme se sabse viral 30-40s clips nikaal dega</p>

  <div class="card">
    <div class="row">
      <input id="url" type="text" placeholder="https://www.youtube.com/watch?v=..." />
      <button id="go">Extract Clips</button>
    </div>
    <label><input id="captions" type="checkbox" checked style="width:auto" /> Captions burn-in karo</label>
    <div id="status" class="status"></div>
  </div>

  <div id="clips" class="clips"></div>
</div>

<script>
  // Point this at your deployed backend's URL
  const API_BASE = "http://localhost:8000";

  const urlInput = document.getElementById("url");
  const goBtn = document.getElementById("go");
  const statusEl = document.getElementById("status");
  const clipsEl = document.getElementById("clips");
  const captionsEl = document.getElementById("captions");

  function setStatus(text, isErr){
    statusEl.textContent = text || "";
    statusEl.className = "status" + (isErr ? " err" : "");
  }

  function renderClips(job){
    clipsEl.innerHTML = "";
    (job.clips || []).forEach(c => {
      const div = document.createElement("div");
      div.className = "clip";
      div.innerHTML = `
        <h3>${c.title || "Clip"}</h3>
        <div class="meta">
          <span class="score">Virality: ${c.virality_score ?? "-"}/100</span>
          <span>${(c.start ?? 0).toFixed?.(1) ?? c.start}s – ${(c.end ?? 0).toFixed?.(1) ?? c.end}s</span>
        </div>
        <p>${c.reason || ""}</p>
        <video controls src="${API_BASE}${c.download_url}"></video>
        <a class="dl" href="${API_BASE}${c.download_url}" download>Download clip</a>
      `;
      clipsEl.appendChild(div);
    });
  }

  async function poll(jobId){
    const res = await fetch(`${API_BASE}/jobs/${jobId}`);
    const job = await res.json();

    if (job.status === "failed"){
      setStatus("Error: " + (job.error || "kuch gadbad ho gayi"), true);
      goBtn.disabled = false;
      return;
    }
    if (job.status === "done"){
      setStatus(`Ho gaya! "${job.video_title}" se ${job.clips.length} clips mile.`);
      renderClips(job);
      goBtn.disabled = false;
      return;
    }
    const labels = {
      queued: "Queue mein hai...",
      downloading: "Video download ho raha hai...",
      transcribing: "Transcript nikaala ja raha hai...",
      analyzing: "AI viral moments dhund raha hai...",
      cutting: "Clips cut ki ja rahi hain...",
    };
    setStatus(labels[job.status] || job.status);
    setTimeout(() => poll(jobId), 2500);
  }

  goBtn.addEventListener("click", async () => {
    const url = urlInput.value.trim();
    if (!url){ setStatus("Pehle YouTube link daalo.", true); return; }

    goBtn.disabled = true;
    clipsEl.innerHTML = "";
    setStatus("Job shuru ho raha hai...");

    try {
      const res = await fetch(`${API_BASE}/jobs`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ youtube_url: url, burn_captions: captionsEl.checked }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Job create nahi hua");
      poll(data.job_id);
    } catch (e) {
      setStatus("Error: " + e.message, true);
      goBtn.disabled = false;
    }
  });
</script>
</body>
</html>
